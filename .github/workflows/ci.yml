name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n remotecheck

      - name: ShellCheck (script)
        run: shellcheck remotecheck

      - name: ShellCheck (remote collector)
        run: |
          awk '/^  cat <<.REMOTE_COLLECTOR.$/{f=1;next} /^REMOTE_COLLECTOR$/{f=0} f' remotecheck |
            shellcheck -s bash -e SC2034 -

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq openssh-server

      - name: Start an SSH server on localhost
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          chmod go-w ~
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/rc_test
          cat ~/.ssh/rc_test.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          for i in 1 2 3 4 5; do ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 1; done

      - name: Start a deliberately risky container
        # Exercises the container checks: privileged, published on all interfaces.
        run: docker run -d --name rc-test-risky --privileged -p 8081:80 busybox:1.36 sleep 3600

      - name: Run tests
        run: |
          RC_TEST_TARGET="$(whoami)@localhost" \
          RC_TEST_ARGS="-i $HOME/.ssh/rc_test" \
          RC_TEST_CONTAINER=rc-test-risky \
            bats --print-output-on-failure test/
